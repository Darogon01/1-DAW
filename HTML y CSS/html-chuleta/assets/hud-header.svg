  <!-- Icono etiqueta -->
  <g id="icono" fill="none" stroke="#ff8a1f" stroke-width="6" stroke-linecap="square">
    <circle cx="990" cy="168" r="84" stroke="#30363d" stroke-width="1"/>
    <path d="M958 128 922 168 958 208"/>
    <path d="M1022 128 1058 168 1022 208"/>
    <path d="M1004 118 976 218"/>
    <path d="M884 168H900M1080 168H1096" stroke-width="2"/>
  </g>
  <text x="1090" y="96" class="lab" text-anchor="end">TAG</text>
  <text x="1156" y="282" class="lab" text-anchor="end">VALIDADO: W3C</text>

  <!-- Regla -->
  <g id="regla" stroke="#30363d">
    <path d="M44 296H1156"/>
    <path d="M44 290V296M144 290V296M244 290V296M344 290V296M444 290V296M544 290V296M644 290V296M744 290V296M844 290V296M944 290V296M1044 290V296M1144 290V296"/>
