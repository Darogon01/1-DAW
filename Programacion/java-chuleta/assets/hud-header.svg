<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="JAVA // CHULETA DE CAMPO">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#0d1117"/>
      <rect width="4" height="10" fill="#ff8a1f"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b222c" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .mut { fill: #7d8590; font-size: 13px; letter-spacing: 1.5px; }
      .lab { fill: #7d8590; font-size: 12px; letter-spacing: 2px; }
      .val { fill: #e6edf3; font-size: 15px; font-weight: 600; letter-spacing: 1px; }
      .acc { fill: #ff8a1f; }
    </style>
  </defs>

  <!-- Panel -->
  <rect x="0" y="0" width="1200" height="320" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="320" fill="url(#grid)"/>
  <rect x="12.5" y="12.5" width="1175" height="295" fill="none" stroke="#30363d"/>

  <!-- Esquinas -->
  <g id="esquinas" fill="none" stroke="#ff8a1f" stroke-width="3">
    <path d="M12 52V12H52"/>
    <path d="M1148 12H1188V52"/>
    <path d="M12 268V308H52"/>
    <path d="M1188 268V308H1148"/>
  </g>

  <!-- Barra superior -->
  <g id="barra-superior">
    <text x="44" y="46" class="mut">SYS://JAVA.REF  ·  DAW / PROGRAMACIÓN  ·  v1.0</text>
    <rect x="900" y="34" width="90" height="14" fill="url(#hatch)"/>
    <rect x="900.5" y="34.5" width="89" height="13" fill="none" stroke="#ff8a1f"/>
    <rect x="1010" y="34" width="10" height="14" class="acc"/>
    <text x="1030" y="46" class="mut">LINK ESTABLE</text>
    <line x1="44" y1="62" x2="1156" y2="62" stroke="#30363d"/>
  </g>

  <!-- Título -->
  <g id="titulo">
    <rect x="44" y="92" width="6" height="98" class="acc"/>
    <text x="68" y="160" fill="#ff8a1f" font-size="78" font-weight="700" letter-spacing="4">JAVA</text>
    <text x="300" y="160" fill="#e6edf3" font-size="40" font-weight="500" letter-spacing="2">// CHULETA DE CAMPO</text>
    <text x="70" y="192" class="mut">TIPOS · OPERADORES · CONTROL · STRING · NÚMEROS · ARRAYS · ARRAYLIST · FUNCIONES</text>
  </g>

  <!-- Lecturas -->
  <g id="lecturas">
    <line x1="44" y1="222" x2="760" y2="222" stroke="#30363d"/>
    <text x="44" y="250" class="lab">MÓDULOS</text>
    <text x="44" y="274" class="val">00 — 13</text>
    <text x="214" y="250" class="lab">MISIONES</text>
    <text x="214" y="274" class="val">10 CASOS</text>
    <text x="384" y="250" class="lab">RUNTIME</text>
    <text x="384" y="274" class="val">JDK 21 LTS</text>
    <text x="574" y="250" class="lab">ESTADO</text>
    <g id="barras-estado">
      <rect x="574" y="262" width="12" height="14" class="acc"/>
      <rect x="590" y="262" width="12" height="14" class="acc"/>
      <rect x="606" y="262" width="12" height="14" class="acc"/>
      <rect x="622" y="262" width="12" height="14" class="acc"/>
      <rect x="638" y="262" width="12" height="14" fill="none" stroke="#ff8a1f"/>
      <text x="662" y="274" class="val">ONLINE</text>
    </g>
  </g>

  <!-- Retícula -->
  <g id="reticula" fill="none" stroke="#ff8a1f">
    <circle cx="990" cy="168" r="78" stroke="#30363d"/>
    <circle cx="990" cy="168" r="54" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="990" cy="168" r="6" fill="#ff8a1f"/>
    <path d="M990 78V112M990 224V258M900 168H934M1046 168H1080" stroke-width="2"/>
    <path d="M934 112L944 112L934 122Z M1046 224L1036 224L1046 214Z" fill="#ff8a1f" stroke="none"/>
  </g>
  <text x="1080" y="104" class="lab" text-anchor="end">OBJ</text>
  <text x="1156" y="282" class="lab" text-anchor="end">ENTRY: main()</text>

  <!-- Regla -->
  <g id="regla" stroke="#30363d">
    <path d="M44 296H1156"/>
    <path d="M44 290V296M144 290V296M244 290V296M344 290V296M444 290V296M544 290V296M644 290V296M744 290V296M844 290V296M944 290V296M1044 290V296M1144 290V296"/>
  </g>
</svg>
